<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استكمال ملف المعلم</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <button onclick="window.location.href='index.html'" class="back-btn">← رجوع للرئيسية</button>
        <h2 style="text-align: center; color: white;">بيانات المعلم</h2>
        <form onsubmit="submitToAdmin(event)">
            <input type="text" name="المادة_المدرسة" placeholder="المادة التي تدرسها" required>
            <select name="المراحل_المتاحة" required>
                <option value="" disabled selected>المراحل التي تدرسها...</option>
                <option>ابتدائي</option><option>إعدادي</option><option>ثانوي</option><option>كل المراحل</option>
            </select>
            <select name="نظام_العمل" onchange="handleModeChange(this.value, 'tr-geo')" required>
                <option value="online">أونلاين فقط</option>
                <option value="yes">أونلاين وأوفلاين</option>
            </select>
            <div id="tr-geo" style="display:none;">
                <select name="محافظة_العمل" class="city-list"><option value="">اختر محافظة العمل...</option></select>
                <input type="text" name="مناطق_العمل_بالتفصيل" placeholder="اكتب المناطق المتاحة لك">
            </div>
            <button type="submit" class="main-btn">حفظ وإرسال الملف</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
